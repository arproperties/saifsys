; Copy this file to config.ini and fill it in.
[camera]
; Cameras are normally kept in saifsys: HR -> Administration -> Cameras. The lines
; below are only used when that page is not on the saifsys server yet.
; The C8c's live video. VERIFICATION_CODE is the 6-letter code on the camera's sticker.
rtsp_url = rtsp://admin:VERIFICATION_CODE@192.168.1.50:554/H.264
; A second room: that camera's own address and code. Leave empty for one camera. Add rtsp_url_3 the same way.
rtsp_url_2 =

; saifsys address, and CAMERA_API_KEY from includes/config.php on that server.
saifsys_url = https://your-saifsys-domain
camera_key = PASTE_CAMERA_API_KEY_HERE

; How alike a face must be to count (0-1). Raise it if people get mixed up, lower it if nobody is recognised.
match_threshold = 0.40
; A match only counts when the person scores at least this much above everyone else.
match_margin = 0.05
; A clear match at least this alike to the person's own photo is kept as a reference
; face (shown in HR -> Cameras -> People -> Photo, up to 5 each). 0 switches it off.
learn_threshold = 0.50
; Tell saifsys about the same person at most this often while they stand in view.
resend_seconds = 120
; How often to look at the video.
check_every_seconds = 0.5
